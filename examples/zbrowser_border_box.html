<!doctype html>
<html>
<head>
<title>Z Browser Border Box Smoke</title>
<style>
body {
  margin: 0;
  background: #f7f3ea;
  color: #202122;
}

.frame {
  margin: 16px;
  padding: 12px 16px;
  border: 2px solid #2f4858;
  background: #fffdf8;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border: 1px solid #8d3b12;
  background: #ffe8d6;
  color: #8d3b12;
}
</style>
</head>
<body>
<div class="frame">
<h1>Border Box Smoke</h1>
<p>This block should render with a full rectangular border, not side brackets.</p>
<p><span class="badge">Inline badge border should also close top and bottom.</span></p>
</div>
</body>
</html>
