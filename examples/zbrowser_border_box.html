<!doctype html>
<html>
<head>
<title>Z Browser Border Box Repro</title>
<style>
body {
  margin: 0;
  background: #e5edf5;
  color: #102a43;
}

.frame {
  width: 260px;
  margin: 20px auto;
  padding: 12px;
  border: 4px solid #243b53;
  background: #fffdf7;
}

.card {
  margin: 12px 0;
  padding: 10px;
  border: 3px solid #d97706;
  background: #fef3c7;
}

.accent {
  border-color: #0f766e;
  background: #ccfbf1;
}
</style>
</head>
<body>
<main class="frame">
<h1>Border Box Repro</h1>
<p>This page should show complete rectangular borders around the frame and both cards.</p>
<div class="card">Card A should have a visible top and bottom edge, not just vertical rails.</div>
<div class="card accent">Card B should also render as a full rectangle.</div>
</main>
</body>
</html>
