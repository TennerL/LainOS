<!doctype html>
<html>
<head>
<title>Z Browser Radio Disc Smoke</title>
<style>
body {
  background: #f3f6fb;
  color: #202122;
  font-family: serif;
  margin: 0;
}
.panel {
  width: 360px;
  margin: 22px auto;
  padding: 16px 20px;
  border: 2px solid #2f4858;
  background: #fffdf8;
}
h1 {
  color: #355c7d;
  margin: 0 0 12px 0;
}
.choice {
  display: block;
  margin: 10px 0;
  color: #263238;
}
</style>
</head>
<body>
<div class="panel">
<h1>Radio Disc Smoke</h1>
<label class="choice"><input type="radio" name="mode" checked> Checked radio should draw discs</label>
<label class="choice"><input type="radio" name="mode"> Empty radio should draw a ring</label>
</div>
</body>
</html>
